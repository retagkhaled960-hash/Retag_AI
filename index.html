<!DOCTYPE html>
<html lang="ar" id="html-tag" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retag Tools | Ultimate Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --p: #9966cc; --a: #ff4444; --bg: #050505; --t: #fff; --c: rgba(255,255,255,0.08); --card-border: rgba(255,255,255,0.05); }
        [data-theme="light"] { --bg: #fdfaf5; --t: #4a3f35; --c: #ffffff; --p: #d4a373; --card-border: rgba(212, 163, 115, 0.2); }

        body { margin: 0; background: var(--bg); color: var(--t); font-family: 'Cairo', sans-serif; transition: 0.4s; overflow-x: hidden; }
        .stars-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.5; background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 5 L53 15 L63 15 L55 22 L58 32 L50 25 L42 32 L45 22 L37 15 L47 15 Z' fill='%239966cc' fill-opacity='0.1'/%3E%3C/svg%3E"); }

        nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.1); backdrop-filter: blur(15px); border-bottom: 1px solid var(--card-border); }
        .logo { font-family: 'Orbitron'; color: var(--p); font-size: 1.5rem; font-weight: bold; }

        .card { background: var(--c); padding: 40px 20px; border-radius: 25px; border: 1px solid var(--card-border); text-align: center; cursor: pointer; transition: 0.4s; }
        .card:hover { transform: translateY(-10px); border-color: var(--p); box-shadow: 0 0 20px rgba(153, 102, 204, 0.2); }
        .card i { font-size: 40px; color: var(--p); margin-bottom: 20px; }

        .sidebar { position: fixed; top: 0; width: 300px; height: 100%; background: var(--bg); z-index: 5000; transition: 0.5s; padding: 30px; border-inline-start: 4px solid var(--p); visibility: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .sidebar.active { visibility: visible; }
        #html-tag[dir="rtl"] .sidebar { left: -350px; } #html-tag[dir="rtl"] .sidebar.active { left: 0; }

        .btn-theme { background: var(--c); color: var(--t); border: 1px solid var(--p); padding: 10px; border-radius: 12px; cursor: pointer; width: 100%; margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; }

        .hidden { display: none !important; }

        /* ستايل الآلة الحاسبة الاحترافية */
        .calc-wrapper { max-width: 380px; margin: auto; background: var(--c); padding: 30px; border-radius: 35px; border: 1px solid var(--p); backdrop-filter: blur(10px); }
        .calc-screen { width: 100%; height: 80px; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); border-radius: 15px; margin-bottom: 25px; display: flex; align-items: center; justify-content: flex-end; padding: 0 20px; font-size: 32px; font-family: 'Orbitron'; color: var(--p); box-sizing: border-box; overflow: hidden; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .calc-btn { padding: 20px; font-size: 20px; font-weight: bold; border: none; border-radius: 15px; background: var(--c); color: var(--t); cursor: pointer; transition: 0.2s; border: 1px solid var(--card-border); }
        .calc-btn:hover { background: var(--p); color: #fff; transform: scale(1.05); }
        .op-btn { color: var(--p); }
        .eq-btn { background: var(--p); color: #fff; grid-column: span 2; }
    </style>
</head>
<body>
    <div class="stars-bg"></div>

    <div id="login-page" style="padding: 100px 5%; text-align: center;">
        <div style="max-width:400px; margin:auto; background:var(--c); padding:40px; border-radius:35px; border: 1px solid var(--card-border);">
            <h2 style="margin-bottom: 30px;"> Hello👋  </h2>
            <input type="text" id="user-name-field" placeholder=" Please enter your name " style="width:100%; padding:15px; margin-bottom:15px; border-radius:12px; border:1px solid var(--p); background:none; color:#fff; box-sizing: border-box;">
            <button onclick="saveUser()" style="width:100%; padding:15px; background:var(--p); color:#fff; border:none; border-radius:12px; font-weight:bold; cursor:pointer; font-size:16px;">دخول آمن</button>
        </div>
    </div>

    <div id="main-dash" class="hidden">
        <nav>
            <div class="logo">RETAG <i class="fas fa-bolt"></i> TOOLS</div>
            <i class="fas fa-bars" onclick="toggleMenu()" style="cursor:pointer; font-size:26px;"></i>
        </nav>
        <h2 id="welcome-txt" style="padding: 40px 8% 0;"> Hi 👋</h2>
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:25px; padding:30px 8%;">
            <div class="card" onclick="openTool('calc')"><i class="fas fa-calculator"></i><h3>الآلة الحاسبة</h3><p>دقة وسرعة في الحساب</p></div>
            <div class="card" onclick="alert('قريباً!')"><i class="fas fa-magic"></i><h3>أداة الصور</h3><p>تعديل احترافي قريباً</p></div>
        </div>
    </div>

    <div id="calc-section" class="hidden" style="padding: 60px 5%;">
        <div class="calc-wrapper">
            <button onclick="closeTool()" style="background:none; border:none; color:var(--p); cursor:pointer; margin-bottom:20px; font-weight:bold;"><i class="fas fa-arrow-right"></i> العودة للرئيسية</button>
            <div id="display" class="calc-screen">0</div>
            <div class="calc-grid">
                <button class="calc-btn op-btn" onclick="clearScreen()" style="color:var(--a)">C</button>
                <button class="calc-btn op-btn" onclick="backspace()">DEL</button>
                <button class="calc-btn op-btn" onclick="add('/')">/</button>
                <button class="calc-btn op-btn" onclick="add('*')">×</button>
                
                <button class="calc-btn" onclick="add('7')">7</button>
                <button class="calc-btn" onclick="add('8')">8</button>
                <button class="calc-btn" onclick="add('9')">9</button>
                <button class="calc-btn op-btn" onclick="add('-')">-</button>
                
                <button class="calc-btn" onclick="add('4')">4</button>
                <button class="calc-btn" onclick="add('5')">5</button>
                <button class="calc-btn" onclick="add('6')">6</button>
                <button class="calc-btn op-btn" onclick="add('+')">+</button>
                
                <button class="calc-btn" onclick="add('1')">1</button>
                <button class="calc-btn" onclick="add('2')">2</button>
                <button class="calc-btn" onclick="add('3')">3</button>
                <button class="calc-btn" onclick="add('.')">.</button>
                
                <button class="calc-btn" onclick="add('0')">0</button>
                <button class="calc-btn eq-btn" onclick="calc()">=</button>
            </div>
        </div>
    </div>

    <div id="sidebar" class="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
            <h3>Settings</h3>
            <i class="fas fa-times" onclick="toggleMenu()" style="cursor:pointer; color:var(--a)"></i>
        </div>
        <button class="btn-theme" onclick="setTheme('light')"><i class="fas fa-sun"></i> Light Mode</button>
        <button class="btn-theme" onclick="setTheme('dark')"><i class="fas fa-moon"></i> Dark Mode</button>
        <button onclick="logout()" style="width:100%; margin-top:50px; padding:15px; background:var(--a); color:#fff; border:none; border-radius:12px; cursor:pointer; font-weight:bold;">تسجيل الخروج</button>
    </div>

    <script>
        // حفظ المستخدم
        function saveUser() {
            const name = document.getElementById('user-name-field').value.trim();
            if(name) {
                localStorage.setItem('retag_name', name);
                location.reload();
            } else { alert("Please enter your name!"); }
        }

        function logout() { localStorage.clear(); location.reload(); }
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
        function setTheme(t) { document.getElementById('html-tag').setAttribute('data-theme', t); localStorage.setItem('theme', t); }

        function openTool(tool) {
            document.getElementById('main-dash').classList.add('hidden');
            if(tool === 'calc') document.getElementById('calc-section').classList.remove('hidden');
        }

        function closeTool() {
            document.getElementById('calc-section').classList.add('hidden');
            document.getElementById('main-dash').classList.remove('hidden');
        }

        // منطق الآلة الحاسبة
        let currentInput = "";
        const screen = document.getElementById('display');

        function add(val) {
            currentInput += val;
            screen.innerText = currentInput;
        }

        function clearScreen() {
            currentInput = "";
            screen.innerText = "0";
        }

        function backspace() {
            currentInput = currentInput.slice(0, -1);
            screen.innerText = currentInput || "0";
        }

        function calc() {
            try {
                currentInput = eval(currentInput).toString();
                screen.innerText = currentInput;
            } catch {
                alert("Math error");
                clearScreen();
            }
        }

        window.onload = () => {
            setTheme(localStorage.getItem('theme') || 'dark');
            const user = localStorage.getItem('retag_name');
            if(user) {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('main-dash').classList.remove('hidden');
                document.getElementById('welcome-txt').innerText = `Hi ${user} 👋`;
            }
        };
    </script>
</body>
</html>
